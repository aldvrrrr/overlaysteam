<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>HP Bar Display</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
            background: transparent;
            overflow: hidden;
        }

        .bar-container {
            width: 350px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 3px solid #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.15s ease-out, background-color 0.3s ease;
        }

        .bar-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000, -2px -2px 4px #000, 2px -2px 4px #000, -2px 2px 4px #000;
            white-space: nowrap;
        }

        .blink {
            animation: blinker 0.8s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>

    <div class="bar-container">
        <div id="fill" class="bar-fill"></div>
        <div id="text" class="bar-text">HP 5000</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "PASTE_API_KEY_KAMU",
            authDomain: "overlay-roblok-keal.firebaseapp.com",
            databaseURL: "https://overlay-roblok-keal-default-rtdb.firebaseio.com",
            projectId: "overlay-roblok-keal",
            storageBucket: "overlay-roblok-keal.appspot.com",
            messagingSenderId: "PASTE_SENDER_ID",
            appId: "PASTE_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('hpState');

        const fillEl = document.getElementById('fill');
        const textEl = document.getElementById('text');
        const maxHP = 5000;

        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.isBleeding) {
                fillEl.style.width = ((data.countdown / 10) * 100) + "%";
                fillEl.style.background = "#d32f2f";
                textEl.classList.add('blink');
                textEl.innerText = data.countdown > 0 ? "BLEEDOUT: " + data.countdown + "s" : "GAME OVER!";
            } else {
                let percent = (data.currentHP / maxHP) * 100;
                fillEl.style.width = percent + "%";
                fillEl.style.background = "linear-gradient(90deg, #4CAF50, #8BC34A)";
                textEl.classList.remove('blink');
                textEl.innerText = "HP " + Math.floor(data.currentHP);
            }
        });
    </script>
</body>
</html>
