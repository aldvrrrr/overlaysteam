<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>HP Bar Display</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
            background: transparent;
            overflow: hidden;
        }

        .bar-container {
            width: 350px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 3px solid #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.05s linear, background-color 0.3s ease;
        }

        .bar-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000, -2px -2px 4px #000, 2px -2px 4px #000, -2px 2px 4px #000;
            white-space: nowrap;
        }

        .blink {
            animation: blinker 0.8s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>

    <div class="bar-container">
        <div id="fill" class="bar-fill"></div>
        <div id="text" class="bar-text">HP 5000</div>
    </div>

    <script>
        const maxHP = 5000;
        let currentHP = 5000;
        let holdInterval = null;
        let bleedTimer = null;
        let isBleeding = false;
        let countdownVal = 10;
        let isKeyDown = false;

        const fillEl = document.getElementById('fill');
        const textEl = document.getElementById('text');

        function updateUI() {
            if (isBleeding) {
                fillEl.style.width = ((countdownVal / 10) * 100) + "%";
                fillEl.style.background = "#d32f2f";
                textEl.classList.add('blink');
                
                // DETIK TETAP DITAMPILKAN DI SINI
                textEl.innerText = countdownVal > 0 ? "GAME OVER (" + countdownVal + "s)" : "MINUS 1";
            } else {
                let percent = (currentHP / maxHP) * 100;
                fillEl.style.width = percent + "%";
                fillEl.style.background = "linear-gradient(90deg, #4CAF50, #8BC34A)";
                textEl.classList.remove('blink');
                textEl.innerText = "HP " + Math.floor(currentHP);
            }
        }

        function startDamage() {
            if (isBleeding || holdInterval !== null) return;
            holdInterval = setInterval(() => {
                currentHP -= 1; 
                if (currentHP <= 0) {
                    currentHP = 0;
                    stopDamage();
                    startBleedout();
                }
                updateUI();
            }, 10);
        }

        function stopDamage() {
            if (holdInterval !== null) {
                clearInterval(holdInterval);
                holdInterval = null;
            }
        }

        function addHP(amount) {
            if (isBleeding) {
                stopBleedout();
                currentHP = amount;
            } else {
                currentHP = Math.min(maxHP, currentHP + amount);
            }
            updateUI();
        }

        function startBleedout() {
            isBleeding = true;
            countdownVal = 10;
            updateUI();

            bleedTimer = setInterval(() => {
                countdownVal--;
                updateUI();
                if (countdownVal <= 0) {
                    clearInterval(bleedTimer);
                }
            }, 1000);
        }

        function stopBleedout() {
            isBleeding = false;
            clearInterval(bleedTimer);
        }

        function resetHP() {
            stopDamage();
            stopBleedout();
            currentHP = maxHP;
            updateUI();
        }

        // CONTROL KEYBOARD
        window.addEventListener('keydown', (e) => {
            if (isKeyDown) return;
            const key = e.key.toLowerCase();
            
            if (key === 'r') { 
                isKeyDown = true; 
                startDamage(); 
            } else if (key === 't') { 
                addHP(1000); 
            } else if (key === 'y') { 
                resetHP(); 
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'r') { 
                isKeyDown = false; 
                stopDamage(); 
            }
        });

        updateUI();
    </script>
</body>
</html>
