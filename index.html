<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Hold Button Overlay with Keyboard Shortcuts</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            font-family: 'Arial Black', sans-serif;
            user-select: none;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .bar-container {
            width: 350px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.75);
            border: 3px solid #000;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.1s linear, background-color 0.3s ease;
        }

        .bar-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000, -2px -2px 4px #000, 2px -2px 4px #000, -2px 2px 4px #000;
            white-space: nowrap;
        }

        .blink {
            animation: blinker 0.8s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0.2; }
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 12px 20px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-damage { background-color: #f44336; }
        .btn-heal { background-color: #2196F3; }
        .btn-reset { background-color: #757575; }
        .btn:active { transform: scale(0.95); }

        .hint {
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #333;
            background: rgba(255,255,255,0.8);
            padding: 4px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="bar-container">
        <div id="fill" class="bar-fill"></div>
        <div id="text" class="bar-text">5000 / 5000</div>
    </div>

    <div class="control-panel">
        <div class="btn-group">
            <button class="btn btn-damage" 
                    onmousedown="startDamage()" 
                    onmouseup="stopDamage()" 
                    onmouseleave="stopDamage()">
                HOLD: TARIK HP (Panah Bawah / 1)
            </button>
            <button class="btn btn-heal" onclick="addHP(1000)">+1000 (Panah Atas / 2)</button>
            <button class="btn btn-reset" onclick="resetHP()">RESET (R)</button>
        </div>
        <div class="hint">
            💡 Shortcut Keyboard: <b>[Panah Bawah / 1]</b> Tarik HP | <b>[Panah Atas / 2]</b> +1000 | <b>[R]</b> Reset
        </div>
    </div>

    <script>
        const maxHP = 5000;
        let currentHP = 5000;
        const bleedoutTime = 10; 
        
        let countdownVal = bleedoutTime;
        let bleedTimer = null;
        let holdInterval = null;
        let isBleeding = false;
        let isKeyDown = false;

        const fillEl = document.getElementById('fill');
        const textEl = document.getElementById('text');

        function updateUI() {
            if (isBleeding) return;

            currentHP = Math.max(0, Math.min(maxHP, currentHP));
            
            let percent = (currentHP / maxHP) * 100;
            fillEl.style.width = percent + "%";
            fillEl.style.background = "linear-gradient(90deg, #4CAF50, #8BC34A)";
            textEl.classList.remove('blink');
            textEl.innerText = Math.floor(currentHP) + " / " + maxHP;

            if (currentHP === 0 && !isBleeding) {
                stopDamage();
                startBleedout();
            }
        }

        function startDamage() {
            if (isBleeding || holdInterval !== null) return;
            holdInterval = setInterval(() => {
                currentHP -= 50;
                updateUI();
            }, 50);
        }

        function stopDamage() {
            if (holdInterval !== null) {
                clearInterval(holdInterval);
                holdInterval = null;
            }
        }

        function addHP(amount) {
            if (isBleeding && amount > 0) {
                stopBleedout();
                currentHP = amount;
                updateUI();
            } else if (!isBleeding) {
                currentHP += amount;
                updateUI();
            }
        }

        function startBleedout() {
            isBleeding = true;
            countdownVal = bleedoutTime;
            
            fillEl.style.width = "100%";
            fillEl.style.background = "#d32f2f"; 
            textEl.classList.add('blink');
            textEl.innerText = "BLEEDOUT: " + countdownVal + "s";

            bleedTimer = setInterval(() => {
                countdownVal--;
                if (countdownVal > 0) {
                    textEl.innerText = "BLEEDOUT: " + countdownVal + "s";
                    fillEl.style.width = ((countdownVal / bleedoutTime) * 100) + "%";
                } else {
                    clearInterval(bleedTimer);
                    textEl.innerText = "GAME OVER!";
                    fillEl.style.width = "0%";
                }
            }, 1000);
        }

        function stopBleedout() {
            isBleeding = false;
            clearInterval(bleedTimer);
            textEl.classList.remove('blink');
        }

        function resetHP() {
            stopDamage();
            stopBleedout();
            currentHP = maxHP;
            updateUI();
        }

        // CONTROL KEYBOARD
        window.addEventListener('keydown', (e) => {
            if (isKeyDown) return; // Mencegah spaming event pas tombol ditahan

            if (e.key === 'ArrowDown' || e.key === '1') {
                isKeyDown = true;
                startDamage();
            } else if (e.key === 'ArrowUp' || e.key === '2') {
                addHP(1000);
            } else if (e.key === 'r' || e.key === 'R') {
                resetHP();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowDown' || e.key === '1') {
                isKeyDown = false;
                stopDamage();
            }
        });

        updateUI();
    </script>
</body>
</html>
